# You can override the included template(s) by including variable overrides
# SAST customization: https://docs.gitlab.com/ee/user/application_security/sast/#customizing-the-sast-settings
# Secret Detection customization: https://docs.gitlab.com/ee/user/application_security/secret_detection/#customizing-settings
# Dependency Scanning customization: https://docs.gitlab.com/ee/user/application_security/dependency_scanning/#customizing-the-dependency-scanning-settings
# Container Scanning customization: https://docs.gitlab.com/ee/user/application_security/container_scanning/#customizing-the-container-scanning-settings
# Note that environment variables can be set in several places
# See https://docs.gitlab.com/ee/ci/variables/#cicd-variable-precedence
image: node:latest

cache:
  paths:
    - cdk-stacks/node_modules/
    - cdk-stacks/lambdas/node_modules/
    - webapp/node_modules/

stages:
  - lint
  - test
  - deploy

include:
  - project: 'wwps-proserve-dod/common/aws-gitlab-analyzers'
    ref: main
    file: '/.gitlab/sast-analyzer.gitlab-ci.yml'
  - project: 'wwps-proserve-dod/common/aws-gitlab-analyzers'
    ref: main
    file: '/.gitlab/secret-detection-analyzer.gitlab-ci.yml'
  - project: 'wwps-proserve-dod/common/fortify-sast'
    ref: main
    file: '/.gitlab/fortify-sast.gitlab-ci.yml'
  - project: 'wwps-proserve-dod/common/checkov-sast'
    ref: main
    file: '/.gitlab/checkov-sast.gitlab-ci.yml'
  - project: 'wwps-proserve-dod/common/grype-sca'
    ref: main
    file: '/.gitlab/grype-sca.gitlab-ci.yml'
  - project: 'wwps-proserve-dod/common/semgrep-sast'
    ref: main
    file: '/.gitlab/semgrep-sast.gitlab-ci.yml'

run-ash-scan:
  image:
    name: registry.gitlab.aws.dev/dbbegimh/automated-security-helper:latest
  stage: test
  allow_failure: true
  script:
    - |-
      ash \
        --source-dir "$(pwd)" \
        --output-dir "$(pwd)/ash_output" || exit 1
  artifacts:
    paths:
      - ash_output
    when: on_success
  rules:
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH && $CI_MERGE_REQUEST_IID
      when: on_success
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
    - if: $CI_COMMIT_BRANCH == 'develop'
      when: on_success
    - if: $CI_COMMIT_BRANCH == 'main'
      when: on_success

# Code linting
lint:
  stage: lint
  before_script:
    # Install dependencies
    - npm install -g eslint@^8.47.0
  script:
    - cd cdk-stacks/lambdas && npm install && npm run lint
    - cd ../../webapp/ && npm install && npm run lint
  cache:
    paths:
      - cdk-stacks/node_modules/
      - webapp/node_modules/
      - cdk-stacks/lambdas/node_modules/
  allow_failure: false
  rules:
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH && $CI_MERGE_REQUEST_IID
      when: always
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: always
    - if: $CI_COMMIT_BRANCH == 'develop'
      when: always
    - if: $CI_COMMIT_BRANCH == 'main'
      when: always

# Common variables
variables:
  GITLAB_CICD_ROLE_NAME: gitlab-runner-role
  REGION: us-east-1
  DEVELOP_ACCOUNT_ID: "381492099169" # Add Dev Account ID
  PRODUCTION_ACCOUNT_ID: "381492099169" # Add Prod Account ID

# Common deploy stage
.deploy_stage:
  stage: deploy
  before_script:
    # Install dependencies
    - apk add --no-cache jq
    - apk add bash
    - cd cdk-stacks/
    - npm run prepare-deploy
  script:
    - echo "Building and deploying the code..."
    - |
      if npm run build; then
        echo "Build complete."
        # Deploy code
        npm run deploy-backend
        npm run deploy-frontend
      else
        echo "Build failed."
        exit 1
      fi
  rules:
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH && $CI_MERGE_REQUEST_IID
      when: on_success
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual

# Develop branch deploy
deploy-develop:
  extends: .deploy_stage
  environment:
    name: develop
    url: $WEB_APP_URL
  variables:
    AWS_CREDS_TARGET_ROLE: arn:aws:iam::$DEVELOP_ACCOUNT_ID:role/$GITLAB_CICD_ROLE_NAME
    AWS_DEFAULT_REGION: $REGION
    CDK_DEFAULT_ACCOUNT: $DEVELOP_ACCOUNT_ID
    CDK_DEFAULT_REGION: $REGION
  rules:
    - if: $CI_COMMIT_BRANCH == 'develop'
      when: on_success

# Production branch deploy
deploy-production:
  extends: .deploy_stage
  environment:
    name: production
    url: $WEB_APP_URL
  variables:
    AWS_CREDS_TARGET_ROLE: arn:aws:iam::$PRODUCTION_ACCOUNT_ID:role/$GITLAB_CICD_ROLE_NAME
    AWS_DEFAULT_REGION: $REGION
    CDK_DEFAULT_ACCOUNT: $PRODUCTION_ACCOUNT_ID
    CDK_DEFAULT_REGION: $REGION
  rules:
    - if: $CI_COMMIT_BRANCH == 'main'
      when: manual
