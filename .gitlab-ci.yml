# You can override the included template(s) by including variable overrides
# SAST customization: https://docs.gitlab.com/ee/user/application_security/sast/#customizing-the-sast-settings
# Secret Detection customization: https://docs.gitlab.com/ee/user/application_security/secret_detection/pipeline/#customization
# Dependency Scanning customization: https://docs.gitlab.com/ee/user/application_security/dependency_scanning/#customizing-the-dependency-scanning-settings
# Container Scanning customization: https://docs.gitlab.com/ee/user/application_security/container_scanning/#customizing-the-container-scanning-settings
# Note that environment variables can be set in several places
# See https://docs.gitlab.com/ee/ci/variables/#cicd-variable-precedence

stages:
    - scan
    - prepare
    - zip-deploy

include:
    - template: Security/SAST.gitlab-ci.yml

sast:
    stage: scan

prepare:
    stage: prepare
    script:
        - apk add --no-cache jq
        - |
            export PROJECT_ID="$(jq -r '.context.projectId' cdk.json)"
            export AWS_ACCOUNT_NUMBER="$(jq -r '.context.accounts.dev.number' cdk.json)"
            export AWS_DEFAULT_REGION="$(jq -r '.context.accounts.dev.region' cdk.json)"
            echo "PROJECT_ID=$PROJECT_ID" >> build.env
            echo "AWS_ACCOUNT_NUMBER=$AWS_ACCOUNT_NUMBER" >> build.env
            echo "AWS_DEFAULT_REGION=$AWS_DEFAULT_REGION" >> build.env
    artifacts:
        reports:
            dotenv: build.env

zip-deploy:
    stage: zip-deploy
    needs:
        - prepare
    variables:
        AWS_CREDS_TARGET_ROLE: arn:aws:iam::$AWS_ACCOUNT_NUMBER:role/$PROJECT_ID-gitlab-runner-role
    rules:
        - if: $CI_COMMIT_BRANCH == "main"
    before_script:
        - apk add --no-cache aws-cli zip
        - |
            echo "Using Project ID: $PROJECT_ID"
            echo "Using AWS Account: $AWS_ACCOUNT_NUMBER"
            echo "Using AWS Region: $AWS_DEFAULT_REGION"
    script:
        - echo "Zipping & deploying $CI_PROJECT_DIR"
        - cd $CI_PROJECT_DIR
        - zip -r deploy.zip * -x "docs/*"
        - aws s3 cp deploy.zip s3://$PROJECT_ID-source-bucket-$AWS_ACCOUNT_NUMBER-$AWS_DEFAULT_REGION
        - aws s3 ls s3://$PROJECT_ID-source-bucket-$AWS_ACCOUNT_NUMBER-$AWS_DEFAULT_REGION
        - echo "Deployment success"
