type Messages @model @auth(rules: [{ allow: owner, ownerField: "userId", identityClaim: "sub" }]) {
    userId: ID @index(name: "byUserId", queryField: "chatByUserId")
    message: String
}

type Mutation {
    testMessage(message: String!): AWSJSON
        @function(name: "resolverFunction")
        @auth(rules: [{ allow: private }])
}
