# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
# General
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        exclude: ^.*\.(hbs)$
        args:
          - --fix=lf
      - id: check-case-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-json
      - id: check-toml
      - id: detect-private-key

  # Secrets
  - repo: https://github.com/awslabs/git-secrets
    rev: 5e28df337746db4f070c84f7069d365bfd0d72a8
    hooks:
      - id: git-secrets
        entry: "git-secrets --scan"
        files: "."

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets
        args: ["--base64-limit", "5.5", "--hex-limit", "4"]
        exclude: .*/tests/.*|package.lock

  # CloudFormation
  - repo: https://github.com/aws-cloudformation/cfn-python-lint
    rev: v0.85.2
    hooks:
      - id: cfn-python-lint
        files: \.template$
        args: [--ignore-checks=W3002]

  - repo: https://github.com/aws-cloudformation/rain
    rev: v1.3.3
    hooks:
      - id: cfn-format
        files: \.template$

  # JS
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.0.0-alpha.9-for-vscode
    hooks:
      - id: prettier # configured by .prettierignore and .prettierrc.json

  # Python
  - repo: https://github.com/timothycrosley/isort
    rev: 5.12.0
    hooks:
      - id: isort
        name: isort (python)
        args: ["--profile", "black", "--filter-files"]

  - repo: https://github.com/psf/black
    rev: 23.3.0
    hooks:
      - id: black

  - repo: https://github.com/charliermarsh/ruff-pre-commit
    rev: "v0.0.264"
    hooks:
      - id: ruff
