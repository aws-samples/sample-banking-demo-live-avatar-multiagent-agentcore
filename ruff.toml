line-length = 120
target-version = "py311"
# Honor excludes even when a path is passed on the command line (e.g. `ruff .`).
force-exclude = true
exclude = ["cdk.out/", ".venv/", "venv/", "node_modules/"]
# Reference implementation (separate project) used as the base for the Tavus
# avatar integration — not part of this repo's lint.
extend-exclude = ["gartner-ai-appdev-platforms-avatar-tavus"]

[lint]
select = ["E", "F", "W", "I"]
# E501 in prompt strings and hex-color formatting; E402 for deferred imports
per-file-ignores = { "patterns/**/*.py" = ["E501", "E402"], "gateway/**/*.py" = ["E501"], "tools/**/*.py" = ["E501"] }
